[project]
name = "helpeval"
version = "0.1.0"
description = "A small toolkit for evaluating whether AI chatbots safely help people who seek help"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mahmud Isa Yola" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpeval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
